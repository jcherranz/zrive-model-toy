name: build

# Run the real builder and refuse any difference from the drawing git holds.
# scripts/check_build.sh carries the checks and the argument for each; this file is the wiring,
# and the wiring has four decisions in it worth stating.
#
# ---------------------------------------------------------------------------------------------
# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN repo-gate.yml. Issue 61.
#
# It is the argument smoke.yml already makes for itself, and it applies here for the same two
# reasons. repo-gate.yml answers one question, whether anything forbidden has been committed, and
# it answers it in seconds with git and bash. This job runs Python, imports the model, reads the
# stylesheet, and writes a file. A Python that moves under the runner image, an import that breaks,
# a stylesheet read that fails, all of them turn the SAFETY gate red for a reason that has nothing
# to do with safety, and TPS.md's Andon section says the red run is the whole signal on this
# project. A signal people learn to squint at is worse than a slower one, so the three stay
# separable: repo-gate red means a name or a figure is committed, smoke red means the page has
# regressed, build red means the drawing is not what its own builder produces.
#
# It is also a different question in the sense the repository already uses. repo-gate asks "is
# anything forbidden here", smoke asks "does it work", and this asks "is what shipped what the
# source says". Putting the third behind the first tick would be the first place they could be
# confused.
#
# ---------------------------------------------------------------------------------------------
# AND WHY IT IS NOT IN THE DEPLOY PATH. pages.yml is untouched by this card, deliberately.
#
# pages.yml is the only workflow that creates a Pages deployment, and its own comment records the
# choice this repository already made about checks that run near a deploy: the gate reports and a
# person takes the page down, because an automated unpublish on a rule that can false-fire would
# take the site down. This check has the same shape. Putting it between the upload and the deploy
# would be a check that can leave the site half published; putting it after the deploy would light
# a second andon in the workflow whose andon is already about something more serious. It runs on
# the tree instead, in front of the push, where a stale drawing is cheap to rebuild. It also has to
# run on pull requests, and pages.yml does not.
#
# ---------------------------------------------------------------------------------------------
# AND WHY IT IS NOT A STEP IN board.yml EITHER, which is the one place a check can genuinely be
# needed twice.
#
# board.yml's commit carries the CI skip marker, so it reaches main with no push-triggered
# workflow in front of it, and that is exactly why board.yml runs the repository gate itself
# before committing. The same reasoning does not reach this check. board.yml writes
# site/board.json and nothing else, and site/board.json is neither an input nor an output of the
# build: established by running the builder on a clean tree and reading what moved, its inputs are
# build/model.py, build/label_widths.json, site/app.css and the name gate's rules under scripts/,
# and its only tracked outputs are site/instance.js and site/layout.js. A board sync therefore
# cannot change what this
# check reads or what it compares, so running it there would add a Python build to the hot path of
# an idempotent sync and buy no claim at all.
#
# NOR CAN A BOARD SYNC TURN THIS RED, and the guard is structural rather than textual. The board
# commit carries the skip marker, so the push raises no run of this workflow. If that marker were
# ever dropped by a squash, a rebase or an org policy, the run would happen and would be green,
# because the tree it would check differs from its parent only in site/board.json. In the other
# direction this job has contents: read, writes nothing back and pushes nothing, and board.yml has
# no push trigger at all, so there is no arrow from here to there to loop.
#
# ---------------------------------------------------------------------------------------------
# NO PATHS FILTER, on purpose. It is tempting, because the only pushes this check can have an
# opinion about are those touching build/ or site/. It is refused for the reason the skip marker
# is already enough: a paths filter is a second and much quieter reason for a check not to run,
# and a check that silently did not run is reported by GitHub in a way that reads like a check
# that passed. Neither repo-gate.yml nor smoke.yml carries one either.
#
# NO setup-python, and no third-party action beyond the checkout. Every module the build imports
# is in the standard library, and the GitHub-hosted image ships python3, so the smallest install
# is no install. The run prints the interpreter it used, so a failure caused by an interpreter
# change is diagnosable from the log rather than guessed at.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the repository and nothing else. This job rebuilds a file in the workspace, compares it,
# puts it back, and pushes nothing anywhere.
permissions:
  contents: read

# Its own group, not `pages`, not `repo-gate` and not `smoke`: this job deploys nothing and must
# never queue behind a deploy. cancel-in-progress is stated rather than inherited, and false,
# because a cancelled check reads as a check that ran; queue: max for the reason repo-gate.yml's
# own comment gives, that false only protects a RUNNING job while the default single pending slot
# lets a second push evict the run that has not started yet.
# KAIZEN.md `kaizen-a-guard-covers-only-the-state-it-names`.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Say what was run. KAIZEN.md `kaizen-a-tool-that-refuses-the-size-you-asked-for` is about a
      # harness that quietly gave back something other than what was asked for; the cheapest
      # countermeasure is that every run states what it actually got.
      - name: Name the interpreter this run used
        run: python3 --version

      # The name register. Issue 164. This workflow is not obviously a content gate and it holds
      # one: build/model.py hashes every string the model ships and refuses the build on a
      # collision with the register, and it runs at import, so every step below that imports the
      # model needs it. The model aborts loudly without it rather than passing a roster it never
      # checked, which is what this step exists to prevent it having to do.
      - name: Materialise the name register
        env:
          FORBIDDEN_SALT: ${{ secrets.FORBIDDEN_SALT }}
          FORBIDDEN_NAMES_SHA256: ${{ secrets.FORBIDDEN_NAMES_SHA256 }}
        run: bash scripts/ci_register.sh

      # Jidoka. Prove the check refuses a bad drawing before believing it when it says clean.
      # A gate that cannot be shown to fire is not a gate. Both other gates in this repository
      # are run this way and this one is no different.
      # verify-step: build-gate-armed
      - name: Prove the build check fires
        run: bash scripts/check_build.sh --self-test

      # The provenance gate, issue 73, runs inside build/build_layout.py, so the step below
      # already exercises it against the real document on every run. This is the other half of
      # the same rule: one synthetic document per refusal, each differing from a document that
      # passes by exactly the field under test.
      # verify-step: provenance-armed
      - name: Prove the provenance gate fires
        run: python3 build/model.py --provenance-self-test

      # The ontology gate, issue 123, which says where the four registry rows on every panel
      # came from. It runs at import time inside the rebuild below, and on THIS machine it will
      # find no corpus and say so rather than passing: the analysis is on one machine and never
      # in this repository. So the suite below is the whole of what CI can prove about it, and
      # it is written to be provable here: every probe builds its own synthetic corpus in a
      # temporary directory, so the refusals are exercised on a runner that holds no real one.
      # verify-step: provenance-armed
      - name: Prove the ontology gate fires
        run: python3 build/model.py --ontology-self-test

      # NAMED FOR WHAT THE GATE COMPARES, WHICH IS NOT WHAT THIS STEP USED TO CLAIM. Issue 103
      # row B10. The gate takes its baseline from the index and prints which snapshot it read;
      # here the workspace is a fresh checkout, so the index, HEAD and the disk are the same
      # bytes and the run says "the index copy". That agreement is exactly why the defect was
      # invisible in CI and expensive locally: this step's old title was true here and the same
      # sentence printed on a contributor's machine was about the file on their disk.
      #
      # AND THE THIRD STATE IS READ HERE RATHER THAN COLLAPSED INTO GREEN. Issue 168 R4(a). The
      # gate exits 3 when everything it could check was clean AND at least one sub-gate could
      # not look at the corpus it re-reads. Before that repair those gates said so on stderr, two
      # hundred lines up, under a run whose last line was VERDICT: clean and whose step here was
      # green. A permanent red would be worse and is not the repair: the state is annotated and
      # summarised rather than either failed or hidden. Anything other than 0 or 3 fails the job.
      #
      # IT USED TO BE THE STATE OF EVERY RUN HERE AND IT IS NOT ANY MORE. Issue 196. The three
      # gates that read a vault no runner has now check their declared tables against
      # build/corpus_reading.txt, an attestation written by a machine that held the corpus, so
      # this runner exits 0 and the gate prints under its own verdict which gates read a
      # recording rather than a corpus. Exit 3 stays handled because the state it names is still
      # reachable: delete that file and the gates go back to looking at nothing. That is the one
      # thing this branch is now for, and it is why the branch is not deleted.
      # verify-step: build-gate
      - name: The drawing git holds is what the builder produces
        run: |
          set +e
          bash scripts/check_build.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -ne 3 ]; then exit "$rc"; fi
          echo "::warning title=The build gate ran incomplete::Sub-gates that re-read a corpus could not look at one on this runner. This job did not establish anything they cover. Read the INCOMPLETE verdict in the log above."
          {
            echo "### The build gate: INCOMPLETE, not clean"
            echo
            echo "It exited 3. Everything it could check was checked and nothing is wrong with it,"
            echo "and at least one sub-gate could not look at the corpus it re-reads. This runner"
            echo "holds no vault, so this is the expected state here and it is not a pass."
            echo "The gates that could not look are named in the step log."
          } >> "$GITHUB_STEP_SUMMARY"

      # The populate registry, read back out of the bytes the page loads rather than out of the
      # model that wrote them. Issue 72 wrote both the registry and the reader; issue 103 found
      # that NOTHING ran the reader, here or anywhere, for as long as it had existed. It answers
      # two questions no other check in this repository asks: whether a class the document
      # declares is drawn by no object, which is an entry that has rotted, and whether an object
      # names a class the document does not declare, which is a tile whose source nothing can be
      # asked about. Both are the generated-but-never-verified class.
      #
      # It runs AFTER the rebuild above and not before, deliberately: the bytes it reads are then
      # the bytes the builder just produced and compared, so a registry that is complete in the
      # committed file and incomplete in the rebuilt one cannot pass here.
      # verify-step: routes
      - name: The populate registry is complete and every drawn object binds to it
        run: python3 scripts/routes.py
