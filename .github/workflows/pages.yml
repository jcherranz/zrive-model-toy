name: Deploy site to Pages

# Deploy on a code push, then read the deployed bytes back through the forbidden-content
# gate. The gate runs AFTER the deploy on purpose: what matters is what the origin serves,
# not what the working tree holds. If it fails, the job fails and the andon is lit; the page
# stays up until a person takes it down, because unpublishing is not a step a workflow should
# take on its own.
#
# THIS IS THE ONLY WORKFLOW THAT CREATES A PAGES DEPLOYMENT. board.yml used to create one too,
# on every run, and the two collided at the deployment level even though their runs serialised
# correctly (issue 39, and board.yml's header carries the argument). board.yml now commits
# site/board.json and dispatches this workflow when, and only when, it committed something, so a
# board change still reaches the origin promptly and an unchanged board publishes nothing at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group, and now one workflow in it: board.yml left when it stopped deploying. It is kept as a
# named group rather than folded away, because it is the queue every Pages deploy in this
# repository passes through and the next thing that wants to deploy belongs in it too.
# cancel-in-progress is false explicitly rather than by default, because a true value here silently
# cancels a deploy with zero steps run and the run still reads as finished.
#
# queue: max covers the other half of that, which cancel-in-progress never did: false protects a
# RUNNING job, while the group is capped at one PENDING run by default (queue: single) and a new
# same-group trigger evicts the waiting one before it starts, with no error anywhere. See the
# concurrency comment in board.yml for the runs that went that way here. queue: max (GA
# 2026-05-07) raises the pending limit to 100 and processes them first in, first out.
#
# Caveat: no released actionlint recognises the queue key inside concurrency and it reports it
# as an unexpected key. This repository does not lint its workflows; a lint workflow added later
# needs the ignore rule rather than a smaller concurrency block.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Loop guard, and it still earns its place now that board.yml wakes this workflow by hand.
    # board.yml commits site/board.json and then dispatches this workflow. Its commit carries
    # [skip ci], which normally stops the push from starting this workflow at all; this condition
    # is the second line, in case the marker is ever dropped by a squash, a rebase or an org
    # policy. Without the pair, one board change would deploy twice, once from the dispatch and
    # once from the push.
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit != null &&
       github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com' &&
       !contains(github.event.head_commit.message, 'chore(board): sync from issues'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, not the sha that fired this run. Now that a run can wait in the queue behind
      # board.yml instead of being evicted, it can also start after board.yml has committed
      # site/board.json; a checkout of the older triggering sha would then publish a site
      # without that commit and undo it. A static site deploy should publish whatever is current
      # on main at the moment it actually runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # THE DEPLOY STAMP. Issue 47. A feedback report has to name the code the reporter saw, and
      # it used to carry a seven character digest of the drawing under the name "build", which
      # reads as an abbreviated commit, is not one, and moved only when the layout was rebuilt.
      # The value is written here, in the job that publishes, because that is the only place that
      # knows what is being published, and it is written into site/version.js rather than into
      # site/graph.js because graph.js has to stay byte for byte what build/build_layout.py
      # reproduces. site/version.js is the one file in site/ whose deployed bytes are deliberately
      # not the bytes in the tree, and the copy in the tree names no commit, which is the truth
      # about a working tree.
      #
      # The sha comes from the checkout, not from github.sha. This job checks out main at the
      # moment it runs and that is deliberately not always the sha that triggered it, so
      # github.sha can name a commit this deploy is not publishing. git rev-parse HEAD names the
      # tree in the artifact, which is the only claim the stamp is allowed to make.
      #
      # The assertion is the poka-yoke this file already applies elsewhere: a stamping step that
      # silently wrote nothing would leave the published page saying "no deploy stamp", which is
      # honest but useless, and it would read as a page nobody deployed.
      - name: Stamp the deployed commit into site/version.js
        id: stamp
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "// Written by .github/workflows/pages.yml at deploy time. The copy of this file"
            echo "// in the repository names no commit; this one names the commit that was"
            echo "// published, and the sha is the tree that went into the artifact. Issue 47."
            printf 'window.ZV = { commit: "%s", deployedAt: "%s", source: "github pages" };\n' \
              "$sha" "$now"
          } > site/version.js
          cat site/version.js
          grep -qE 'commit: "[0-9a-f]{40}"' site/version.js || {
            echo "::error::the deploy stamp does not carry a 40 character commit sha"
            exit 2
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Prove the forbidden-content gate fires
        run: bash scripts/check_forbidden.sh --self-test

      - name: Forbidden-content gate, against deployed bytes
        run: bash scripts/check_forbidden.sh "${{ steps.deployment.outputs.page_url }}"

      # Jidoka, and for the same reason the gate above reads the origin rather than the disk: a
      # stamp written into the workspace proves nothing about what the public is served. This
      # fetches the stamp back and fails the job unless the page names the commit that was just
      # published, so the defect in issue 47, a value that does not track the deploy, cannot come
      # back without lighting the andon. Retried because the origin can serve the previous
      # deployment for a moment after deploy-pages returns, the same reason the gate above has
      # FETCH_ATTEMPTS.
      - name: Prove the deployed page names the commit that was deployed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/version.js"
          body=""
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS -L "$url" || true)"
            case "$body" in *"$DEPLOYED_SHA"*) break ;; esac
            echo "  attempt $attempt/5: the origin does not name $DEPLOYED_SHA yet"
            # An if, not `[ ... ] && sleep`: under set -e a trailing AND-list that ends false
            # takes the step down on the last attempt, with no message and before the check below
            # can say what went wrong.
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "origin:   $url"
          echo "$body"
          echo "deployed: $DEPLOYED_SHA"
          case "$body" in
            *"$DEPLOYED_SHA"*) echo "the deployed page reports the deployed commit" ;;
            *) echo "::error::the deployed page does not report $DEPLOYED_SHA"; exit 1 ;;
          esac
