name: Deploy site to Pages

# Deploy on a code push, then read the deployed bytes back through the forbidden-content
# gate. The gate runs AFTER the deploy on purpose: what matters is what the origin serves,
# not what the working tree holds. If it fails, the job fails and the andon is lit; the page
# stays up until a person takes it down, because unpublishing is not a step a workflow should
# take on its own.
#
# THIS IS THE ONLY WORKFLOW THAT CREATES A PAGES DEPLOYMENT. board.yml used to create one too,
# on every run, and the two collided at the deployment level even though their runs serialised
# correctly (issue 39, and board.yml's header carries the argument). board.yml now commits
# site/board.json and dispatches this workflow when, and only when, it committed something, so a
# board change still reaches the origin promptly and an unchanged board publishes nothing at all.
#
# AND IT ONLY RUNS WHEN THE SWITCH IS ON. Issue 107. Issue 101 ended with the site taken down: the
# account is on Pro, private Pages needs Enterprise Cloud, so the only states available are
# world-readable and gone, and the owner chose gone. Every job below is gated on the repository
# variable PUBLISH being the string "on", which scripts/publish.sh sets.
#
# GATED, NOT DELETED, and the difference is the point. Deleting this file would have made the next
# publication a job of writing a deploy workflow again, and the owner's requirement is that turning
# the site back on is one command. Deleting it was also the more dangerous half of the choice in
# the other direction: `actions/configure-pages` below CREATES the Pages site, so a file left
# armed would have republished the site the owner had just removed, on the next push.
#
# WHAT A SKIPPED JOB REPORTS, because a workflow that cannot do its job and still goes green is the
# defect issue 103 removed. `if` on the job means the run is recorded as skipped, which GitHub
# renders as neither success nor failure and which no reader can mistake for a deploy. Nothing here
# passes vacuously; it declines, visibly, and scripts/publish.sh status says why in one line.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The floor. Each job narrows it, so the job that cancels runs cannot publish and the job that
# publishes cannot cancel runs. Before issue 62 this block carried pages: write and id-token: write
# for the whole workflow; those now sit on the one job that deploys.
permissions:
  contents: read

# THE CONCURRENCY GROUP MOVED FROM THE WORKFLOW TO THE JOB. Issue 62, and nothing about the group
# itself changed: same name, same cancel-in-progress: false, same queue: max, same argument, which
# is reproduced verbatim on the deploy job below. What changed is its SCOPE, and only because a
# workflow-level group holds the whole run, including a job whose entire purpose is to clear the
# queue that group is stuck in. Measured, not assumed: in the jam of 2026-08-11 the newest run sat
# at status `pending` with `total_count: 0` jobs for 24 minutes, so no step anywhere in this file
# could have run. A supersede step inside a queued run is unreachable by construction.
#
# The move was proved before it was made, because board.yml's concurrency comment records what a
# concurrency key doing something other than what it says costs here: three runs evicted inside
# five minutes with zero steps run and no error anywhere. A throwaway probe workflow was pushed,
# dispatched three times in thirteen seconds and read back. Its ungated job started immediately on
# all three (14:55:40, 14:55:46, 14:55:53) while its gated job was held, which is the property the
# supersede job below depends on; its gated jobs ran strictly first in, first out and NONE was
# evicted (14:55:40-14:56:29, 14:56:40-14:57:28, 14:57:31-14:58:19). Under the default queue:
# single the middle one would have been evicted by the third dispatch while it was still pending.
# So queue: max is honoured on a job-level block, and the probe was deleted in the commit that
# used the answer.

jobs:
  # SUPERSEDE, AND WHY IT CANCELS ALMOST NOTHING. Issue 62.
  #
  # Only the newest commit is worth publishing, so an older Pages run that has not begun publishing
  # has no value and can only block. This job cancels those, and it can do it because it is in no
  # concurrency group and is therefore never held by the one the deploy job waits in.
  #
  # WHAT MAKES A CANCELLATION SAFE, established by reading the deployment record rather than by
  # reasoning about it. The deploy job below targets the github-pages environment, so GitHub opens
  # a deployment the moment the job is admitted, BEFORE any step runs. In the 2026-08-11 jam the
  # head-of-queue job sat with zero steps for 24 minutes and its deployment (5852717266, and
  # 5852232804 in the first occurrence) carried an EMPTY status history the whole time, while the
  # deployment that actually published went waiting -> queued -> in_progress -> success. A
  # deployment with no status has never been handed to the Pages build and publish pipeline;
  # cancelling it writes one `error` status, releases the environment, and changes nothing the
  # origin serves. That was observed twice, both times followed by the head publishing correctly
  # and the smoke suite green against the freshly deployed origin.
  #
  # So the rule is the strictest one the evidence supports: cancel a run ONLY if its job has not
  # started a single step. Anything that has started is left alone, which costs at most one
  # redundant publish and can never publish the wrong thing, because the deploy job checks out
  # `ref: main` rather than its triggering sha and therefore publishes whatever main holds at the
  # moment it runs. A run that is doing something is also not what jams the queue; a run that never
  # starts is.
  #
  # A red here means the jam guard broke, not that the deploy did. The deploy reports itself.
  supersede:
    runs-on: ubuntu-latest
    # The same loop guard the deploy job carries, and it has to be repeated rather than inherited:
    # without it a board-bot push whose skip marker had been dropped would run this job, cancel a
    # legitimate deploy that had not started yet, and then skip its own deploy, publishing nothing.
    # THE TWO COPIES MOVE TOGETHER. Changing one and not the other is the defect.
    if: >-
      vars.PUBLISH == 'on' &&
      (github.event_name != 'push' ||
       (github.event.head_commit != null &&
        github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com' &&
        !contains(github.event.head_commit.message, 'chore(board): sync from issues')))
    permissions:
      # actions: write is the whole of it. No pages: write and no id-token: write, so this job
      # cannot deploy even by accident, and contents is not needed because it checks nothing out.
      actions: write
    steps:
      - name: Cancel older Pages runs that have not begun publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          echo "this run is number ${THIS_NUMBER}; anything older and not yet started is superseded."

          # Every run of this workflow that has not finished. `completed` is the only terminal
          # status, so this covers requested, queued, pending, waiting and in_progress in one
          # filter and does not have to enumerate them.
          gh api "repos/${GH_REPO}/actions/workflows/pages.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed")
                  | "\(.run_number) \(.id) \(.status) \(.head_sha[0:7])"' > runs.txt || {
            echo "::error::could not list runs of this workflow; the jam guard did not run"
            exit 1
          }

          cancelled=0
          left=0
          frozen=0
          # Read the list on file descriptor 3, not on stdin. `gh` inside the loop reads stdin and
          # would eat the remaining lines, so the loop would silently examine only the first
          # candidate and report a clean sweep.
          while read -r number id status sha <&3; do
            [ -n "${number:-}" ] || continue
            if [ "$number" -ge "$THIS_NUMBER" ]; then
              continue
            fi

            gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" > jobs.json

            # Two independent readings of the same claim, because one of them alone would be a
            # guess. A run held at the run level has no jobs at all; a job admitted but starved of
            # a runner has a job and zero steps. Neither has published anything.
            #
            # THE SUPERSEDE JOB ITSELF IS EXCLUDED, and it is excluded by name rather than by
            # selecting the deploy job by name, which is not the same choice. The first version of
            # this counted every job in the candidate run, so every run matched "something here has
            # started", because this job is in that run and is always running. It reported
            # `superseded 0 older run(s); left 4 alone` against four runs whose deploy jobs had
            # zero steps between them. The live run found that; the reasoning had not.
            #
            # Excluding by name fails safe in both directions, which selecting `deploy` by name
            # does not. Rename the deploy job and this still counts it, so the guard stays
            # conservative. Rename or remove this job and the filter matches nothing, so the run
            # reads as started and is LEFT ALONE. The reckless direction, a filter that matches
            # nothing and therefore declares everything cancellable, is not reachable from here.
            # NAME THE STARTED STATUSES, DO NOT NAME THE UNSTARTED ONES. The second live finding of
            # this card: the first repair listed `queued` and `waiting` as the not-yet-started
            # statuses and a job held by a job-level concurrency group reports neither. It reports
            # `pending`, so a run whose deploy job had run zero steps still read as started and was
            # left alone. A list of the ways a job can be waiting is a list that the next status
            # GitHub adds makes wrong, and wrong in the direction of doing nothing forever.
            #
            # `in_progress` and `completed` are the two that mean work happened, and the zero-steps
            # reading below is what covers a status nobody here has seen: a job that has begun has
            # steps, whatever it is called. Both readings have to say not started.
            started="$(jq '[ .jobs[] | select(.name != "supersede")
                             | select(.status == "in_progress" or .status == "completed") ] | length' jobs.json)"
            steps="$(jq '[ .jobs[] | select(.name != "supersede") | .steps[]? ] | length' jobs.json)"
            # The third reading, and it changes no decision here: how many of those jobs have
            # FINISHED. A run whose every job is completed while its record still reads
            # in_progress is issue 68's frozen record, not a deploy that is running, and the two
            # were reported with the same sentence until that card. It is still left alone, and
            # for a better reason than "it has begun": there is nothing left of it to cancel.
            unfinished="$(jq '[ .jobs[] | select(.name != "supersede")
                                | select(.status != "completed") ] | length' jobs.json)"

            if [ "$started" -eq 0 ] && [ "$steps" -eq 0 ]; then
              echo "  run ${number} (${id}, ${sha}, ${status}): no job has started a step, cancelling."
              if gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/cancel" --silent; then
                cancelled=$((cancelled + 1))
              else
                # A run that finished between the listing and here answers 409. That is the race
                # resolving itself in the safe direction and is not a failure.
                echo "  run ${number} (${id}) refused the cancel, most likely already finished."
              fi
            elif [ "$started" -gt 0 ] && [ "$unfinished" -eq 0 ]; then
              echo "  run ${number} (${id}, ${sha}): the record reads ${status} and all ${started} of its jobs are completed."
              echo "    A stale record, not a running deploy (issue 68). Nothing to cancel; LEFT ALONE."
              frozen=$((frozen + 1))
            else
              echo "  run ${number} (${id}, ${sha}, ${status}): ${started} job(s) started and ${steps} step(s) begun, LEFT ALONE."
              left=$((left + 1))
            fi
          done 3< runs.txt

          echo "superseded ${cancelled} older run(s); left ${left} alone because they had begun,"
          echo "and ${frozen} whose jobs had all completed while the run record had not caught up."

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One group, and now one workflow in it: board.yml left when it stopped deploying. It is kept
    # as a named group rather than folded away, because it is the queue every Pages deploy in this
    # repository passes through and the next thing that wants to deploy belongs in it too.
    # cancel-in-progress is false explicitly rather than by default, because a true value here
    # silently cancels a deploy with zero steps run and the run still reads as finished.
    #
    # queue: max covers the other half of that, which cancel-in-progress never did: false protects
    # a RUNNING job, while the group is capped at one PENDING run by default (queue: single) and a
    # new same-group trigger evicts the waiting one before it starts, with no error anywhere. See
    # the concurrency comment in board.yml for the runs that went that way here. queue: max (GA
    # 2026-05-07) raises the pending limit to 100 and processes them first in, first out.
    #
    # Caveat: no released actionlint recognises the queue key inside concurrency and it reports it
    # as an unexpected key. This repository does not lint its workflows; a lint workflow added
    # later needs the ignore rule rather than a smaller concurrency block.
    #
    # No `needs: supersede`, on purpose. The two jobs run side by side so a deploy is never delayed
    # by the guard, and the ordering still works: this job enters the group and waits, the
    # supersede job cancels whatever is starving at the head of it, and this job is admitted. A
    # supersede job that fails therefore cannot stop a deploy either.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    # Loop guard, and it still earns its place now that board.yml wakes this workflow by hand.
    # board.yml commits site/board.json and then dispatches this workflow. Its commit carries
    # [skip ci], which normally stops the push from starting this workflow at all; this condition
    # is the second line, in case the marker is ever dropped by a squash, a rebase or an org
    # policy. Without the pair, one board change would deploy twice, once from the dispatch and
    # once from the push.
    #
    # The supersede job above carries a byte-identical copy, for a different reason of its own that
    # its comment states. THE TWO MOVE TOGETHER.
    if: >-
      vars.PUBLISH == 'on' &&
      (github.event_name != 'push' ||
       (github.event.head_commit != null &&
        github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com' &&
        !contains(github.event.head_commit.message, 'chore(board): sync from issues')))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, not the sha that fired this run. Now that a run can wait in the queue behind
      # board.yml instead of being evicted, it can also start after board.yml has committed
      # site/board.json; a checkout of the older triggering sha would then publish a site
      # without that commit and undo it. A static site deploy should publish whatever is current
      # on main at the moment it actually runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # THE DEPLOY STAMP. Issue 47. A feedback report has to name the code the reporter saw, and
      # it used to carry a seven character digest of the drawing under the name "build", which
      # reads as an abbreviated commit, is not one, and moved only when the layout was rebuilt.
      # The value is written here, in the job that publishes, because that is the only place that
      # knows what is being published, and it is written into site/version.js rather than into
      # a generated document, because site/instance.js and site/layout.js have to stay byte
      # for byte what build/build_layout.py reproduces. site/version.js is the one file in site/ whose deployed bytes are deliberately
      # not the bytes in the tree, and the copy in the tree names no commit, which is the truth
      # about a working tree.
      #
      # The sha comes from the checkout, not from github.sha. This job checks out main at the
      # moment it runs and that is deliberately not always the sha that triggered it, so
      # github.sha can name a commit this deploy is not publishing. git rev-parse HEAD names the
      # tree in the artifact, which is the only claim the stamp is allowed to make.
      #
      # The assertion is the poka-yoke this file already applies elsewhere: a stamping step that
      # silently wrote nothing would leave the published page saying "no deploy stamp", which is
      # honest but useless, and it would read as a page nobody deployed.
      - name: Stamp the deployed commit into site/version.js
        id: stamp
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "// Written by .github/workflows/pages.yml at deploy time. The copy of this file"
            echo "// in the repository names no commit; this one names the commit that was"
            echo "// published, and the sha is the tree that went into the artifact. Issue 47."
            printf 'window.ZV = { commit: "%s", deployedAt: "%s", source: "github pages" };\n' \
              "$sha" "$now"
          } > site/version.js
          cat site/version.js
          grep -qE 'commit: "[0-9a-f]{40}"' site/version.js || {
            echo "::error::the deploy stamp does not carry a 40 character commit sha"
            exit 2
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Prove the forbidden-content gate fires
        run: bash scripts/check_forbidden.sh --self-test

      - name: Forbidden-content gate, against deployed bytes
        run: bash scripts/check_forbidden.sh "${{ steps.deployment.outputs.page_url }}"

      # Jidoka, and for the same reason the gate above reads the origin rather than the disk: a
      # stamp written into the workspace proves nothing about what the public is served. This
      # fetches the stamp back and fails the job unless the page names the commit that was just
      # published, so the defect in issue 47, a value that does not track the deploy, cannot come
      # back without lighting the andon. Retried because the origin can serve the previous
      # deployment for a moment after deploy-pages returns, the same reason the gate above has
      # FETCH_ATTEMPTS.
      - name: Prove the deployed page names the commit that was deployed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail
          url="${PAGE_URL%/}/version.js"
          body=""
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS -L "$url" || true)"
            case "$body" in *"$DEPLOYED_SHA"*) break ;; esac
            echo "  attempt $attempt/5: the origin does not name $DEPLOYED_SHA yet"
            # An if, not `[ ... ] && sleep`: under set -e a trailing AND-list that ends false
            # takes the step down on the last attempt, with no message and before the check below
            # can say what went wrong.
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "origin:   $url"
          echo "$body"
          echo "deployed: $DEPLOYED_SHA"
          case "$body" in
            *"$DEPLOYED_SHA"*) echo "the deployed page reports the deployed commit" ;;
            *) echo "::error::the deployed page does not report $DEPLOYED_SHA"; exit 1 ;;
          esac
