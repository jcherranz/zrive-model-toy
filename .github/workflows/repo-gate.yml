name: repo gate

# Read every tracked file in this repository and fail the build on anything that must never be
# committed. This is the companion to the gate in pages.yml and board.yml, and it exists
# because that one cannot see this: Pages publishes site/ and nothing else, so a gate that
# reads deployed bytes has no opinion about build/, scripts/, or any of the documentation. A
# real surname sat in scripts/ for a day inside the very script written to keep names out, and
# no amount of running the origin gate would have found it.
# HANSEI.md `2026-08-09-gate-scoped-to-the-public-surface`.
#
# It runs on pull requests as well as on pushes, because the point of a repository gate is to
# be in front of the commit rather than behind it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Its own group, not the `pages` group: this job deploys nothing and must never queue behind a
# deploy. cancel-in-progress is stated rather than inherited, and false, because a cancelled
# safety check reads as a check that ran. queue: max for the same reason one step earlier: false
# only protects a running job, and the default one pending slot lets a second push evict the
# gate run that has not started yet, which also reads as a check that ran.
concurrency:
  group: repo-gate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The register this gate matches against. Issue 164: it used to arrive with the checkout,
      # because it was a tracked file, and it was a tracked file whose own header printed the
      # salt that protects it. It is untracked now and comes from two repository secrets, and
      # this step writes it outside the working tree and points the steps below at it.
      #
      # It fails the job when the secrets are not available, which on a pull request from a FORK
      # is always, because GitHub gives a fork's pull request no secrets. That is the intended
      # direction: this gate cannot run there and must not appear to have run.
      - name: Materialise the name register
        env:
          FORBIDDEN_SALT: ${{ secrets.FORBIDDEN_SALT }}
          FORBIDDEN_NAMES_SHA256: ${{ secrets.FORBIDDEN_NAMES_SHA256 }}
        run: bash scripts/ci_register.sh

      # THE CHEAPEST CHECK IN THE REPOSITORY, AND UNTIL NOW THE ONE CI DID NOT RUN. Issue 168
      # R4(e). `node --check` over the shipped scripts is step 1 of scripts/verify.sh and it was
      # in no workflow at all, which matters more here than anywhere: site/ has no build step, so
      # a syntax error in a shipped file is caught by nothing until a reader opens the page and
      # it draws nothing. This repository has shipped a blank page once already
      # (HANSEI.md `2026-08-09-screenshot-before-javascript`).
      #
      # It is here rather than in build.yml because it is about the tracked files and takes no
      # Python, which is this workflow's whole shape. The runner image ships node.
      #
      # THE NAME SAYS WHAT THE STEP RUNS AND NO LONGER STATES THE CLAIM. Issue 240, found by
      # measurement rather than filed: it was `Every shipped script parses`, which is
      # scripts/verify.sh's step 1 label word for word, and verify.sh prints its step labels as
      # `== ` run headings. Same shape as the step twenty lines below and as #237, so it goes the
      # same way. build.yml carries the rule.
      # verify-step: syntax
      - name: Parse every shipped script with node --check
        run: |
          set -euo pipefail
          bad=0
          for f in site/*.js scripts/*.mjs; do
            if node --check "$f"; then
              echo "  [OK]   $f"
            else
              echo "::error file=$f::$f does not parse"
              bad=1
            fi
          done
          exit $bad

      # AND THE LIST THIS STEP BELONGS TO IS CHECKED AGAINST THE LIST OVER THERE. Issue 168
      # R4(e). The step above closes one instance of a drift; this closes the structure that
      # produced it, by joining every step scripts/verify.sh registers to the workflow step that
      # claims it. It is static, it runs no browser and no build, and it belongs in the workflow
      # that is already the fast one.
      # verify-step: ci-drift-armed
      - name: Prove the CI drift check fires
        run: bash scripts/check_ci_drift.sh --self-test

      # AND THE NAME BELOW DESCRIBES THE JOB RATHER THAN QUOTING THE CHECK. Issue 240. It was
      # `Every step scripts/verify.sh runs is run by a workflow`, which is a word-for-word PREFIX
      # of the run heading scripts/check_ci_drift.sh prints, and the same sentence is in that
      # script's header and is scripts/verify.sh's step 15 label. Four statements, none joined.
      #
      # THE TRUNCATION IS WHY THIS ONE WAS ALREADY FALSE. The heading ends `, or is named as one CI
      # cannot`, and the check does exactly that: it reports three exempt steps as [SKIP] and still
      # exits 0. A name that stops one clause short claimed the check refuses what it in fact
      # excuses, which is #237's copy one degree further on, drifted rather than merely unheld.
      #
      # The `verify-step: ci-drift` marker on the next line is the only pinned relation here and it
      # joins two keys. Editing the name back to the full heading was refused for #237's reason: it
      # restores the appearance of a maintained relation and leaves it exactly as unheld.
      # verify-step: ci-drift
      - name: Run the CI drift check, joining the workflows to scripts/verify.sh
        run: bash scripts/check_ci_drift.sh

      # Jidoka. Prove the gate is armed before believing it when it says clean. A gate that
      # cannot be shown to fire is not a gate.
      #
      # THIS NAME AND THE TWO NEAREST IT EQUAL A scripts/verify.sh LABEL AND STAY. Issues 240 and
      # 241. `Prove the repository gate fires`, `Repository gate, over every tracked file` and
      # `Prove the CI drift check fires` above are each a verify.sh step label word for word, and
      # the rule in build.yml did not remove them, so the reader who notices should have the reason
      # here rather than conclude the rule is decorative. Each of these names the JOB the step runs;
      # it matches a verify.sh label because verify.sh names the same job the same way, and if
      # either side is reworded both sentences stay true. The three names #240 and #241 removed
      # stated a CLAIM about an outcome, and one of them had already gone false. build.yml carries
      # the rule, and #244 the measurement.
      # verify-step: repo-gate-armed
      - name: Prove the repository gate fires
        run: bash scripts/check_repo.sh --self-test

      # verify-step: repo-gate
      - name: Repository gate, over every tracked file
        run: bash scripts/check_repo.sh
