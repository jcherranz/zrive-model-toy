name: smoke

# Drive the page in a headless browser and fail the build on any behavioural regression.
# scripts/smoke.mjs carries the invariants and the argument for each; this file is only the
# wiring, and the wiring has three decisions in it worth stating.
#
# ---------------------------------------------------------------------------------------------
# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN repo-gate.yml. Issue 58.
#
# repo-gate.yml answers one question, whether anything forbidden has been committed, and it
# answers it in about fifteen seconds with git and bash. This job downloads nothing but does start
# a browser, drive three of them, and dispatch pointer gestures, which is a different kind of
# thing to be wrong: a browser that fails to start, or a runner image that stops shipping Chrome,
# turns the SAFETY gate red for a reason that has nothing to do with safety. TPS.md's Andon
# section says the red run is the whole signal on this project and that nothing shortens the gap
# between a red run and somebody noticing. A signal people learn to squint at is worse than a
# slower one, so the two stay separable: repo-gate red means a name or a figure is committed,
# smoke red means the page has regressed, and neither can be mistaken for the other.
#
# It is also a different question in the sense the repository already uses. Both existing gates
# ask "is anything forbidden here". This asks "does it work". Those have never been the same check
# and putting them behind one tick would be the first place they could be confused.
#
# ---------------------------------------------------------------------------------------------
# AND WHY IT IS NOT IN THE DEPLOY PATH. pages.yml is untouched by this card, deliberately.
#
# pages.yml uploads an artifact, publishes it and then reads the deployed bytes back through the
# forbidden-content gate, and that gate's own comment records the choice this repository already
# made: the gate reports and a person takes the page down, because an automated unpublish on a
# rule that can false-fire would take the site down on a CSS decimal. A smoke failure has exactly
# the same shape and a weaker claim: it says a behaviour changed, not that anything unsafe was
# published. Putting it between the upload and the deploy would be a check that can leave the site
# half published, and putting it after the deploy would light a second andon in the workflow whose
# andon is already about something more serious. It runs on the tree instead, in front of the
# push, where a regression is cheap to fix.
#
# ---------------------------------------------------------------------------------------------
# THE BROWSER, AND WHAT "PINNED" MEANS HERE. The smallest install is no install: the GitHub-hosted
# Ubuntu image ships Google Chrome, so the pin is `runs-on: ubuntu-24.04` rather than
# `ubuntu-latest`, and the browser moves only when somebody edits that line. Stated honestly: that
# pins the IMAGE and not the BUILD, and Chrome inside the 24.04 image is refreshed with the image.
# The alternative, downloading a fixed Chrome for Testing build on every run, pins harder and buys
# a 150MB third-party download on a repository whose whole safety posture is that it fetches
# nothing it does not have to. Every run prints the exact version it drove, so a failure caused by
# a browser change is diagnosable from the log rather than guessed at, and if the image ever stops
# shipping Chrome the suite fails with the list of paths it tried, which is the message that
# failure needs.
#
# ---------------------------------------------------------------------------------------------
# THAT CAVEAT CAME TRUE, AND THE DECISION IS TO KEEP THE IMAGE PIN. Issue 67, decided 2026-08-11.
#
# The build moved underneath the suite inside one day: Chrome 151 on the dispatch that failed to
# start a browser, Chrome 150 on the rerun of the identical commit that gave 70 of 70. So the
# question the pin was carrying is now a live one and not a hypothetical, and the answer is to
# accept the moving build, for three reasons and with one thing added.
#
#   1. THE VERSION IS NOT WHAT FAILED. Neither build failed an assertion. 151 failed to open a
#      debug port, with dbus errors beside it, which is the well known headless-Chrome-on-CI
#      launch flake and not a behavioural difference; 150 and 151 each produced 70 of 70 on the
#      runs where they started. Pinning the build would have changed nothing about that incident.
#      What did change it is the retry and the count assertion in scripts/smoke.mjs, which are
#      about the two faults that were actually there.
#   2. PINNING THE BUILD IS A BIGGER LIABILITY THAN THE ONE IT REMOVES. A pinned Chrome for
#      Testing download is a third-party binary fetched over the network on every run, and to be
#      worth anything it needs a pinned URL and a recorded checksum, which is a supply-chain
#      surface this repository does not have today and a maintenance obligation that rots quietly:
#      a pin nobody moves is a browser years behind the one every reader of the page uses.
#      check_forbidden.sh's own comment already makes the same trade in the other direction, that
#      a mechanism which can false-fire near the deploy costs more than the failure it catches.
#   3. THE SUITE IS A REGRESSION NET FOR THE PAGE, not a conformance test against one browser. A
#      behaviour that breaks on the Chrome the runner ships is a behaviour that breaks for
#      readers, and a suite frozen on an old build would report clean on exactly that.
#
# What is added, because the caveat's real cost was diagnosis and not risk: the version is written
# into the job summary as well as the log, so a run that failed can be correlated with a browser
# change from the run list without opening it. REVERSING THIS DECISION is one step: replace the
# resolve step below with a Chrome for Testing download pinned by version and checksum, and set
# SMOKE_CHROME to it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the repository and nothing else. The suite needs no token: it serves site/ from the runner
# and drives a browser that is blocked from reaching github.com at the network layer.
permissions:
  contents: read

# Its own group, not `pages` and not `repo-gate`: this job deploys nothing and must never queue
# behind a deploy. cancel-in-progress is stated rather than inherited, and false, because a
# cancelled check reads as a check that ran; queue: max for the reason the repository gate's own
# comment gives, that false only protects a RUNNING job while the default single pending slot lets
# a second push evict the run that has not started yet.
# KAIZEN.md `kaizen-a-guard-covers-only-the-state-it-names`.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Say what was driven. KAIZEN.md `kaizen-a-tool-that-refuses-the-size-you-asked-for` is
      # about a harness that quietly gave back something other than what was asked for; the
      # cheapest countermeasure is that every run states what it actually got.
      - name: Name the browser this run drove
        run: |
          set -euo pipefail
          for c in "${CHROME_BIN:-}" /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "SMOKE_CHROME=$c" >> "$GITHUB_ENV"
              echo "$c"
              "$c" --version
              # In the summary as well as the log, so the version this run drove is readable from
              # the run list. Issue 67: two dispatches of the same commit drove two different
              # Chrome builds and it took opening both logs to find that out.
              {
                echo "browser: \`$("$c" --version)\`"
                echo ""
                echo "image: \`ubuntu-24.04\`, which pins the image and not the build. See the header of this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::no preinstalled browser found on this image; the suite will print the paths it tried"

      # The suite serves site/ from this checkout on a local port and tests that. It is
      # deliberately not pointed at the deployed origin: a check that reads the origin answers a
      # question about the last deploy, and this one has to answer a question about the commit in
      # front of it.
      #
      # THREE EXIT CODES, AND THEY MUST NOT BE COLLAPSED. Issue 67. 1 is a page regression, which
      # is what this workflow exists to report. 2 is the suite saying it could not answer: a
      # browser that never started after its retry, or a run that recorded fewer assertions than
      # it says it intends. Both fail the job, because a check that measured a fifth of itself is
      # not a pass and the incident that produced this card looked exactly like one. They fail it
      # with different words, because the header of this file argues at length that a browser
      # failing to start must not read as the page having regressed, and until now the suite said
      # `VERDICT: the page has regressed` for a browser that never started.
      #
      # ONE STEP, BECAUSE THERE IS ONE SUITE. Issue 107 added a second step here for
      # build/check_grain.mjs, whose 33 assertions about the two altitudes of the drawing were run
      # by nothing at all; issue 109 folded that file into scripts/smoke.mjs, so this step runs 177
      # assertions where it ran 144. The argument the second step carried was that a reader has to
      # be able to see which suite said which, and the merged suite answers it better than two
      # steps did: it prints an intended-against-ran count for every phase, named, so a log says
      # which phase failed rather than which file. The other half of that argument was that the
      # grain assertions must still run when the ones before them failed, and they do, for the same
      # reason every other phase does: each is a group() that reports its own throw and does not
      # stop the run, and the grain phases get a browser of their own, so a viewport that never
      # opened costs them nothing.
      # verify-step: smoke-local
      - name: The page behaves, at every width and at both altitudes
        run: |
          set +e
          node scripts/smoke.mjs
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "smoke: clean, every assertion the suite intends." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::error::THE PAGE HAS REGRESSED. An assertion about the page failed; the log names each one."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "smoke: **the page has regressed**. See the failures in the log." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              # THREE CAUSES, AND THEY DO NOT SHARE A REMEDY. Issue 223. This message used to list
              # two of them and end "Re-run before reading anything into it". Issue 216 added the
              # third, a resource the page needs that did not arrive, and it is now the commonest:
              # a stylesheet 404, a stylesheet served as text/plain, an origin answering 200 with a
              # placeholder, a refused connection. That case is PERSISTENT. A browser that never
              # started is worth re-running; a 404 refuses the same way on every re-run, so the one
              # message whose whole purpose is to say "this run is not evidence" was telling the
              # reader to go and gather the same non-evidence again. The refusal already names the
              # resource it was waiting for, so the advice for that cause is to read the name.
              echo "::error::THE SMOKE SUITE COULD NOT ANSWER. This is a harness failure and is NOT evidence"
              echo "::error::about the page. Three things produce it: a browser that never started, a run"
              echo "::error::that recorded fewer assertions than it intends, or a resource the page needs"
              echo "::error::that did not arrive. The log carries the per-phase count, and a refusal over a"
              echo "::error::resource names the resource."
              echo "::error::THEY DO NOT SHARE A REMEDY. Re-run the first two. Do not just re-run the third:"
              echo "::error::a resource that did not arrive is missing again on the next run. Read the name"
              echo "::error::out of the log and fix what serves it."
              {
                echo ""
                echo "smoke: **could not answer** (harness, not the page)."
                echo ""
                echo "Read the log first: it says which of three states this is, and they do not share a remedy."
                echo ""
                echo "- **a browser that never started**, or **a run that recorded fewer assertions than it intends**: re-run. The log carries the per-phase intended-against-ran count."
                echo "- **a resource the page needs did not arrive**: do not just re-run. A 404, a stylesheet served under the wrong content type, an origin answering 200 with a placeholder and a refused connection are all persistent, and the re-run refuses the same way. The refusal names the resource; read that name out of the log and fix what serves it."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::the smoke suite exited $rc, which it has no meaning for."
              ;;
          esac
          exit $rc
