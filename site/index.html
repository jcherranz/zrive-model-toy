<meta charset="utf-8">
<!-- THE POLICY, AND IT IS HERE BECAUSE A READER'S CREDENTIAL IS. Issue 172.
     feedback.js keeps a fine grained GitHub token in this browser's localStorage, at
     zmt.gh.token, and this origin is public. The XSS surface was traced and is clean: every
     innerHTML sink was read, escapeHtml encodes, an issue title goes through textContent. That
     is a statement about today's code and not about tomorrow's, and the whole point of a policy
     is that it holds when the next sink is written by somebody who did not read that audit.
     Pages serves no response headers of its own, so a meta tag is the only place this can live,
     and it sits on the second line of the head because a meta policy is enforced from the point
     the parser reads it: below the stylesheet link or below a script tag, part of this document
     would load unprotected and the tag would be a claim rather than a lock.

     WHY EACH DIRECTIVE. `default-src 'none'` is the floor, so anything not named below is
     refused: this page loads no font, no image, no media, no plugin, no worker and no frame, and
     app.css contains no url() at all, which was counted rather than assumed. `script-src 'self'`
     is the one that carries the credential: all twelve scripts are external and same origin,
     there is not one inline script, one style attribute or one on-something handler in this
     file, so an injected script is refused and that is the path from an XSS to a stolen token.
     `connect-src` names the two places this page really talks to, its own origin for board.json
     and api.github.com for the board's live poll and for filing a card. `img-src 'self'` is
     there for the favicon this site does not ship and every browser asks for anyway.
     `base-uri` and `form-action` do not fall back to default-src and so are written out.

     AND `style-src` IS THE ONE PLACE THIS IS NOT STRICT, WHICH IS WORTH SAYING PLAINLY.
     render.js builds the type and programme palette as a style element it appends to the head,
     because those colours are generated from the model and cannot be typed into app.css. Under a
     bare `style-src 'self'` that element is refused, which was measured and not guessed: the
     drawing came up with every tile the same near black. A hash would work only until the model
     gained a type or a programme, and then the palette would die silently, which is a worse
     failure than this one. So style elements are allowed inline and style ATTRIBUTES are refused
     outright, which is the half of style-src worth keeping and which now costs nothing: every
     style this page writes goes through the CSSOM, and a CSSOM write is not governed by style-src
     at all. It cost two lines to become true. feedback.js built two panes with a style attribute
     inside an innerHTML string, which no search for setAttribute could see and which the smoke
     suite found by driving the page rather than by reading it; both are CSSOM writes now, thrown
     the same way as the write that puts those panes back on. `style-src` is repeated whole for
     browsers that do not implement the two granular directives, since an unknown directive is
     ignored and would drop those browsers back onto default-src with no stylesheet at all.

     frame-ancestors IS DELIBERATELY ABSENT AND IS NOT A THING THIS TAG COULD DO. It is ignored
     in a meta policy by specification, so writing it would state a protection nobody has. Pages
     cannot set it either. Whether this page should be frameable is the owner's, along with the
     larger question this issue leaves him: whether a credential belongs in a browser at all. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'none'; img-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">

         heading's own size and weight rather than the nav's so that it reads as the words it
         replaced, its text is its state, and pressing it opens the other six as ordinary links
         to their own addresses. The cohort and the programme code in the students variant are
         written by the page from the drawing rather than typed here, because a name or a number

         WHAT WENT WITH THE SUBTITLE. "drawn as named instances joined by the verbs that relate

    <!-- HOW MUCH OF THE PROGRAMME THE DRAWING IS, IN THE HEADING, BECAUSE THAT IS WHERE THE

         IT IS NOT A TENTH CONTROL AND NOT A FIFTH READING. #120 split this row because it already

         a clause inside the sentence that was already here, written by router.js from the view's

         AND IT IS A FACT ABOUT SCOPE RATHER THAN ABOUT STANDING. #101 and #110 withdrew every

    <!-- THE CONTROL AND THE CLAUSE ARE TWO ELEMENTS NOW, AND NO WORD CHANGED. Issue 131. The
         sentence is 471 CSS px wide and the row it shares is the heading, the readout and the

         The clause gives way instead. It is the least load bearing thing in the row and it

         plate keeps its one line at every width. Nothing here is reworded and nothing is removed:
         at 1220 and above the sentence is entire, and on a phone it wraps as it always did. -->
    <!-- SCOPE IS A SET AND THE RAIL IS WHERE IT IS SET, issue 136. What stood here was the

         NOT ONE WORD OF IT IS TYPED HERE. router.js writes every chip from the view's own `counts`

    <h1>
      <span class="h-diagram"><span class="pgrail" id="pgrail" role="group"
      aria-label="the programmes drawn"></span></span>
      <span class="h-board">The work on this drawing, one card per issue</span>
      <span class="h-students">The <span id="hstudprog">Z-IB</span> cohort, every student in

      <!-- The same term read twice, issues 80 and 82. A route with no heading of its own inherits

      <!-- ISSUE 152 DELETED THE OUTLINE'S. It read "The outline, in curriculum order" and it was

           IS THE ORDERING LEGIBLE WITHOUT IT? Yes, and it is the page's own structure that says

           DOES ANYTHING ELSE NAME THE VIEW? Yes. `.term-switch` inside the sheet carries

           WHY THE ELEMENT GOES AND NOT JUST ITS WORDS. An h1 that renders nothing is an unnamed

           So the h1 now carries a heading on the diagram, the board and the student list, and

    </h1>
    <!-- TIME IS AN INTERVAL YOU DRAG AND NOT A NAME YOU PICK. Issue 137. What stood in the box
         after this was `weeks`, a reading whose value was a menu of four presets, and the owner
         singled it out: "the weeks filter is crucial, but is this the best we can do?" It is not,
         and the reason is functional rather than a matter of taste. The term is a bounded ordered
         continuum of 24 weeks browsed in about 22 overlapping windows. A menu treats it as an
         unordered set of names: it hides the neighbourhood, so stepping to the week next door
         costs two interactions instead of one and there is no way to see that the week you are
         moving into is empty until after you have moved into it; and it can express membership in
         a preset list but not extent, so "just this week" and "the whole of the spring" both fall
         outside it. The value has two degrees of freedom, position and width, which is a brush by
         definition and not a scrubber.

         IT IS A READING AND A CONTROL AT ONCE, WHICH IS WHAT PAYS FOR ITS WIDTH. One column per
         week across the term. The column is how many sessions the scope holds that week; the part
         of it the model holds a complete record for is solid and the remainder is hollow, in the
         same filled-against-hollow grammar the chips beside it use as a fraction. So a reader sees
         which weeks are heavy and which weeks the records barely cover BEFORE travelling there,
         which is the thing no menu of names could ever have shown.

         IT OPENS NOTHING AND CARRIES NO DISCLOSURE MARK. Every other control on this row that owns
         a box declares `aria-controls` and takes the mark that says so; this one owns no box, so
         it declares nothing and is marked with nothing. A mark here would be an affordance
         promising a panel that does not exist.

         NOT ONE COLUMN OF IT IS TYPED HERE. term.js owns the term, the window and every number on
         this strip, and it builds the whole of the inside of this element from the model, for the
         reason the chips beside it are built by router.js: a count typed into this file is right
         on one scope out of a hundred and twenty seven.

         AND IT IS AFTER THE READOUT RATHER THAN BEFORE IT, WHICH IS A MEASUREMENT AND NOT A TASTE.
         Between the heading and the plate it read better and it MOVED: `tiles` goes from `80` to
         `76 of 80` the moment a window is on, the plate is sized by its own readings, and every
         item before it in the row shifts by the difference. Measured at 1536 with the strip in that
         slot, its own track jumped 31.4 CSS px on the first narrowing and a further 6.8 as the
         digits changed, which is more than two weeks of a 24 week track moving out from under the
         pointer dragging it. The nav is a fixed distance from the right edge and the plate a fixed
         distance from the nav, which is #131's arrangement; this slot is the only one in the row
         whose left edge and width are both constant, so it is the slot a direct manipulation
         control has to have. Measured again in that slot: one left edge and one width at
         every one of the 24 window widths, where the other slot moved twice. -->
    <div class="brush" id="brush" role="slider" tabindex="0"
         aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"></div>
    <nav class="hnav">
      <!-- WHAT THE READER DOES, AND AFTER ISSUE 139 THERE ARE FOUR THINGS IN IT. #120 split this
           row into a readout plate and a nav; this card deletes the plate, because two of the
           three readings on it were the same finding counted twice and the third was arithmetic
           over a picture the reader is looking at. `grain` was never a reading: it changes the
           address and it changes every mark on the canvas, which is what an action is, and it was
           on the plate only because #120 gathered the three "what am I looking at" controls
           together. It is here now, unchanged in id, menu and behaviour, wearing the nav's paint
           instead of the plate's.

           Page level, and reachable over anything the page ever puts on top of itself:
             feedback   how anything on this page gets reported at all, which is why it is the
                        one control that must never be behind something

           View level, and free to go when the view does:
             grain      the altitude the drawing is drawn at, withdrawn on the board and the
                        student list, where there is no drawing to have an altitude
             absence    what is missing from what is drawn, withdrawn where the drawing is
             view       navigation, and a sheet is a place, so this stays reachable rather than
                        covered: it is the visible way out of the place, and a reader who wants
                        the board from inside the outline should not have to find Escape first.
           The scope rail is view level too and needs no rule, because it lives in the heading,
           which is already swapped out on every route that opens a sheet. -->
      <!-- WHAT THIS CONTROL IS FOR, WRITTEN DOWN BECAUSE IT NEVER WAS. Issue 247. `grain` is the
           one control of the original nine that came through three redesigns without ever being
           argued for or against; every other survivor was justified again during one of them, and
           surviving by not being questioned is the weakest standing a control can have. The owner
           has ruled that it stays. What was missing is the sentence, and a control whose reason is
           unwritten is one redesign away from being deleted by somebody who does not know.

           THE TWO ALTITUDES ANSWER TWO DIFFERENT QUESTIONS AND NEITHER CAN BE ASKED AT THE
           OTHER'S. `sessions` answers WHICH SESSIONS RUN AND WHEN. `modules` answers WHAT THE
           SYLLABUS SAYS THEY ARE FOR. Neither is a summary of the other and neither is a zoom
           level, which is the reading the word `modules` invites and which the measurement below
           refuses on five of the seven programmes.

           THE POPULATION, so that every figure under it can be held against something. Driven on
           the running page at `2e7563a`: the seven single-programme addresses at both altitudes,
           fourteen drawings, at 1440 by 900 and again at 390 by 844, plus `#/p/ALL`,
           `#/p/ZSC+ZBL` and `#/p/ZIB+ZCFA` at 1440 by 900. The page's counts and the two
           generated documents' agree everywhere, which is what `the scope`'s third assertion
           already holds all fourteen to.

           ONE. THE FRAME NEVER MOVES. Six lanes at both altitudes, on all seven, at both
           viewports. This control changes what stands in two of the six lanes and what those two
           lanes are called; it changes nothing else about the drawing's structure.

           TWO. THE EXCHANGE, WHICH IS THE WHOLE OF THE ANSWER. Over the seven, the two syllabus
           lanes hold 166 tiles at sessions and 76 at modules. Not one of the 330 tiles the seven
           sessions drawings paint is a Module or a Module delivery: the count is zero on every one
           of them, so the grouping the syllabus declares is drawn at one altitude and nowhere
           else. Sixty of the 76 are exactly those objects. The other 16 are the session templates
           and cohort sessions the syllabus records no module for, which is the whole of what
           survives a fold and is why Z-HR keeps two of its six and Z-CFA all six.

           THREE. WHAT A READER CAN READ AT ONE AND NOT AT THE OTHER. The shape rather than the
           strings, which is this repository's own rule about quoting an instance. At sessions a
           tile in those two lanes carries a session template's own title and a cohort session's
           own date. At modules it carries the module code and name the syllabus declares, how
           many templates that module holds, and the delivery's date SPAN rather than a day. The
           lane heading says the same thing one line up, and on Z-CFA, whose syllabus records no
           module on any of its 45 rows, it says `no module recorded`, which is an answer and not
           a silence.

           FOUR. IT IS NOT A SIZE CONTROL, AND ON THE PHONE IT IS NOT ONE AT ALL. On the two tall
           programmes the fit goes 0.3088 to 1.1317 on Z-BL and 0.3223 to 1.1317 on Z-SC at 1440
           by 900, so a label a reader had to zoom to read is readable at rest. On the other five
           the fit does not move: 1.1317 at both altitudes. At 390 by 844 the fit is bound by the
           drawing's width, which is the same 1230 at both altitudes, so the same two go 0.2622 to
           0.2780 and 0.2737 to 0.2780 and the altitude buys the phone almost nothing in size.
           ON THE PHONE THIS IS A CONTENT CONTROL. And it can cost size: `#/p/ZIB+ZCFA` draws
           66 tiles on 77 lines at BOTH altitudes and the fit goes DOWN, 0.6774 to 0.6399. A
           redesign that treats `modules` as the smaller picture is right about two of the seven
           and wrong everywhere else.

           FIVE. UNDER A SCOPE THAT IS A SET IT IS ALSO THE WAY OUT OF A REFUSAL. `#/p/ALL` at
           sessions is 83 tiles in the term lane against the budget of 72, so the address is
           refused, the drawing is at modules, and the refused row on this control carries the 83.
           `#/p/ZSC+ZBL` is 53, under the budget, and its two altitudes are 157 tiles on 253 lines
           against 73 on 93.

           AND WHAT THE POPULATION DOES NOT COVER, stated rather than left to be assumed. The 120
           other scopes. Every state of the term window, which `sessionLoad` reads, so a window
           changes which altitude a union resolves to. The two readings of the term and the board,
           where this control is withdrawn because there is no drawing to have an altitude. And
           anything at all about how often a reader presses it, which nothing in this repository
           records and no measurement here invents. -->
      <!-- AND THE INTERACTION WAS MEASURED BEFORE ANYTHING WAS PROPOSED, AND NOTHING IS CHANGED.
           Issue 247's second half, and prose only is a legitimate answer to it. #132 landed first
           and was read before this was designed. THE PANEL IS NOT WHERE THIS BELONGS: `grain` is a
           property of the drawing and the panel is a property of a selection, so a reader with
           nothing selected could not reach it. What the panel did do, without being asked, is give
           the press somewhere to land. Driven: with a Z-BL session template selected, following
           the `modules` row leaves the panel open on the module that swallowed it and #132's
           `in this lane` region goes from 28 rows to 5; from a cohort session it lands on the

           drops out on the way, which is the honest statement that a module carries no agenda. On
           Z-CFA the selection survives the press unchanged, which is the join-by-id branch.

           THREE THINGS A REDESIGN WOULD REACH FOR, EACH REFUSED FOR A STATED REASON. Moving it
           into the panel, refused above. Greying `modules` on Z-CFA the way the budget refusal
           greys `sessions`: refused, because those are two different sentences. The grey means
           this page will not draw that, and Z-CFA's modules address is a real drawing answering a
           real question with `no module recorded` on its own lane heading, so the grey would
           delete the answer. And spending the phone's headroom on it: refused, because the total
           chrome bounded at 0.1730 since #248 measures 0.1600, which is about eleven pixels at
           844, and on the phone this control changes content and not size while already saying
           its value on its own face in five characters. -->
      <!-- AT WHAT ALTITUDE. Issue 89. The syllabus groups its sessions into modules, the vault has
           carried that grouping since before this repository existed, and two of the seven
           drawings are 2578 and 2470 units tall because they draw every row of it; the modules
           grain draws the same programme with those rows gathered into the modules the syllabus
           declares, which takes Z-BL from 28 tiles in each syllabus lane to 5 and Z-SC from 25 to
           6. Both drawings are built at build time, one per grain per view, each with its own
           drawing digest that check_build.sh reproduces byte for byte: the control switches
           between two artefacts and lays nothing out. Every word and every number under it is
           written by app.js off the model, never typed here. -->
      <!-- AND IT SAYS ITS VALUE AND NOT ITS KEY, which is issue 139 taking the plate's grammar off
           a control that left the plate. `grain sessions` is a label beside a value, which is what
           an instrument writes about itself; a nav item states the thing it is set to and lets the
           disclosure mark say that pressing it offers something else, which is what the scope
           chips beside it and the view segments after it already do. The word cost five visible
           characters on every one of the 35 addresses this page answers, and the two altitudes
           name themselves: `sessions` and `modules` are not a value that needs a noun in front of
           it. The sentence is in the title and at the head of the box. -->
      <span class="grpick" id="grpick"><button id="grbtn" class="linkbtn" type="button"
              aria-expanded="false" aria-controls="grmenu"
              title="the altitude this drawing is drawn at"><span
              class="ctl-v" id="grval">sessions</span></button><span class="grmenu"
              id="grmenu" hidden></span></span>
      <!-- ABSENCE IS ONE IDEA WITH TWO NUMBERS THAT NEVER ADD. Issue 139, and it is the whole of
           this card. The model flags 95 property rows `absent`, and until now the page carried
           them under one heading, `gaps N of 95`, with a menu behind it that listed them in two
           groups. The registry says of each class whether any system holds a row of it, and that
           answer splits the 95 into two populations that have nothing to do with each other:

             22 a system holds the row and the field in it is empty, so somebody can open that
                row this week and fill it in. Eleven sessions with nobody assigned to teach them,
                six sponsor links absent, five instructors with no employer named.
             73 no system anywhere records the fact, so no effort inside the tooling that exists
                closes them. Duration 38, location 13, module 8, cohort identity 7, delivery 6,
                and the programme's own module list.

           95 IS THE SUM OF TWO THINGS THAT ARE NOT THE SAME KIND OF THING, and a reader who sees
           it reads a backlog of ninety five items. There is no cell anywhere in this page for it
           now: the two numbers sit side by side on one control, separated by a middle dot and
           never by a plus, each in its own colour, each naming the population it is over in the
           same fraction grammar the chips in the heading use. The left number is what falls
           inside what is currently drawn and the right is the term total.

           AND EACH SWITCH DRAWS ITS OWN KIND WHERE IT IS MISSING, which is what makes this a
           control rather than a second thermometer. `work` on puts an empty socket on every node
           carrying one of the 22, so the eleven unstaffed sessions are visible on the picture the
           reader is already looking at rather than in a list beside it. `unrecorded` on is the
           control that used to be called `ghosts`, unchanged in what it does to the tiles no
           system holds, and it now also marks the 73 in that same ghost treatment: a class no
           system holds, met either as a dashed tile or as a socket on a solid one.

           Every number and every socket is written by app.js off the model, never typed here. -->
      <span class="abs" id="abs" role="group"
            aria-label="what is missing from what is drawn"><button id="abswork"
              class="linkbtn abs-btn abs-work" type="button" aria-pressed="true"
              title="the values a system holds a row for and has left empty"><span
              class="ctl-k">work</span> <span class="ctl-v"
              id="absworkv">0/22</span></button><span class="abs-sep"
              aria-hidden="true">&middot;</span><button id="absunrec"
              class="linkbtn abs-btn abs-unrec" type="button" aria-pressed="true"
              title="the facts no system records, and the classes no system holds"><span
              class="ctl-k">unrecorded</span> <span class="ctl-v"
              id="absunrecv">0/73</span></button></span>
      <!-- THE DIAGRAM IS A PEER VIEW AND NOT A HOME THE OTHERS DEPART FROM. Issue 139. What stood
           here was two loose links, `students` and one link whose word and target swapped with the
           route, so the page had no element anywhere that said what the views ARE. A segmented
           selector says it by existing: both are always on screen, the current one is filled, and
           pressing the one you are on does nothing rather than taking you somewhere.

           `students` IS NOT ONE OF THEM, AND THAT IS A REPAIR RATHER THAN A DELETION. The roster
           is one cohort's list, and since #136 the scope is a SET: a header link to it opened the
           roster of whichever programme happened to be first in scope and named none of them,
           which is the defect #121 and #136 were both filed about with the numbers the other way
           round. `#/students` is unchanged and still answers; the way in is the cohort tile's own
           panel, where `see all 34 students` names the cohort it is about. -->
      <button id="fbtoggle" class="linkbtn" type="button" aria-pressed="false"
              title="visual feedback mode: click any element to capture it with what was on screen">feedback</button>
    </nav>
    <span class="vsel" id="vsel" role="group" aria-label="which view"><a id="navdiagram"
            class="linkbtn vseg" href="#/">diagram</a><a id="navboard" class="linkbtn vseg"
            href="#/board">board</a></span>
  </div>
</header>
<!-- EVERY CONTROL IN THIS ROW IS THE SAME BOX, and that is issue 77's first two findings, which
     had one cause between them. .linkbtn carried `padding: 2px 2px` and no height, so five of the
     five controls here rendered 19 or 21 CSS px tall and every one of them failed WCAG 2.2
     SC 2.5.8 Target Size (Minimum), in a repository that already gates itself on WCAG 2.2 for
     contrast. The 19 and the 21 were the second finding as well: two of these five carry a border
     and three did not, so the row that reads as one line sat on two baselines a pixel apart. Both
     are fixed in the stylesheet rather than here, by one min-height and one transparent border
     that the two bordered controls only recolour, so a control added to this row later is the
     right size and on the right line without anybody remembering to make it so. -->

<main id="view-diagram">
  <!-- The canvas is a viewport onto a plane. The drawing is moved by app.js through the svg's
       viewBox, and the dot grid is a background on this box, driven from the same numbers. The
       view control sits inside the canvas because it acts on the canvas, and because being
       inside it means the board view, which does not draw this main at all, needs no rule to
       hide it. -->
  <!-- WHAT A CLICK ON A NODE DOES, ON THE THING IT IS ABOUT RATHER THAN IN A BOX AT THE BOTTOM
       OF THE SCREEN. Issue 154. It was the first of the two items left in the footer's help and
       the only statement of its kind anywhere on the page; #79's own repair to the three items it
       inherited was to put each on the control it is about, and this is that repair applied to the
       last two. It costs no visible character: the plane is the thing a reader points at before
       they wonder whether it answers.

       ON THE CANVAS AND NOT ON THE `svg`, WHICH IS A MECHANICAL REASON AND NOT A PREFERENCE. Two
       of them. A `title` ATTRIBUTE is an HTML affordance and the tooltip a reader gets from one is
       reliable on this div and is not on an SVG root, where the idiom is a `<title>` CHILD; and
       render.js writes the svg's `aria-label` per drawing, so anything added there is overwritten
       on the first paint. A node's own `<title>` is a descendant and still wins over this one
       wherever the pointer is on a node, so what this sentence answers is a hover on the empty
       plane, which is exactly the reader who has not worked out that the tiles are live. -->
  <div id="canvas"
       title="Click a node for its properties. An instructor also brings out its employer, and the students card draws the individuals the picture carries">
    <svg id="graph" role="img" aria-label="Instance diagram of one cohort"></svg>
    <div class="zoomctl" id="zoomctl" role="group" aria-label="view">
      <button id="zoomout" class="zbtn" type="button" aria-label="zoom out"
              title="zoom out (minus key)">&minus;</button>
      <span class="zlevel" id="zoomlevel"
            title="zoom, where 100% is the whole drawing on screen. Hold Ctrl, or Cmd on a Mac, and scroll to zoom, or pinch; scrolling on its own moves the drawing, as does a drag with Ctrl, Shift or Cmd held; fit brings it back">100%</span>
      <button id="zoomin" class="zbtn" type="button" aria-label="zoom in"
              title="zoom in (plus key)">+</button>
      <button id="zoomfit" class="zbtn" type="button"
              title="bring the whole drawing back into view (0 key)">fit</button>
    </div>
  </div>
  <!-- ---- THE FOOTER, ISSUE 154 ------------------------------------------------------------
       "Is this what a professional webapp footer looks like?", and the honest answer to what was
       there was no. It carried one control, `how to read this`, and a box behind it, and by this
       project's own rule from #128 a sentence that explains how to read the page goes; a footer
       whose entire content is an explainer is that failure at the bottom of the screen.

       WHAT A FOOTER ON THIS TOOL OWES A READER, which is the question the card asked before any
       styling. One thing, and it is the one fact on this page that is about the PAGE rather than
       about the drawing or the view: which build you are looking at. site/version.js already
       carries it and the deploy workflow already writes it. A build stamp is about the page, so by
       the seventh principle a page footer is its correct home, and that is the argument for
       keeping a small one rather than deleting the element outright.

       AND WHAT IT DOES NOT CARRY, EACH FOR A STATED REASON. No drawing digest: a digest is about
       the PICTURE and not about the page, so the same principle that puts the build stamp here
       keeps that off it, and the feedback report already carries it beside the commit where a
       reporter needs the pair. No population of the view: every view already states its own, in
       the chips, the absence switches and the sheet's own sentence. And no link farm, no social
       icons, no copyright line, which the card ruled out in those words: this is a private tool
       with one reader.

       THE TWO THINGS THE DELETED BOX SAID THAT NOTHING ELSE DID ARE NOT DELETED, THEY MOVED, and
       that is the same repair #79 made to the three it inherited. A fact belongs on the thing it
       is about: what a click on a node does is now on the drawing itself, and the modifier a drag
       wants joins the wheel and the Ctrl on the zoom readout, which already carried half of it.
       Neither costs a visible character, because both are titles on controls a reader is already
       pointing at.

       IT IS WRITTEN BY app.js AND NOT TYPED HERE, for the reason every other number on this page
       is: the stamp is a property of the deploy and this file is what gets deployed. A commit
       typed into this element would name whichever commit somebody last remembered to paste. -->
  <footer>
    <p class="fstamp" id="fstamp"></p>
  </footer>
</main>

<main id="view-board">
  <!-- #128 took the second sentence off. A board with no control on any card and nothing that
       responds to a drag says both halves of it by being that board. -->
  <p class="bmeta" id="bmeta">The board reflects GitHub Issues.</p>
  <!-- Which source the board is reading and how fresh it is, written by board.js. Empty until
       there is something true to say, and hidden by the stylesheet while it is empty. It is
       deliberately not an aria-live region: the age in it moves every second and a screen
       reader would read the whole line out again each time. -->
  <p class="bstatus" id="bstatus"></p>
  <div id="bbody"></div>
</main>

<!-- THE PANEL IS SIX REGIONS AND EVERY ONE OF THEM CARRIES ITS OWN NAME IN THE DOCUMENT. Issue
     132, and the names are here rather than in selection.js because a count of them is the
     growth control this surface did not have: the suite pins the number of `[data-region]`
     elements in this panel and the number of things inside it that answer a press, exactly as
     HEADER_BY_QUERY pins the header. A seventh region added by somebody who has not read that
     card has to move a constant in front of a reader.

     FOUR ARE ALWAYS THERE AND TWO ARE CONDITIONAL. `its outline` is on a session template, since
     that is the object the model hangs an agenda on, and `the instructors this drawing holds` is
     on a cohort session nobody is teaching. Both are marked `hidden` here and unhidden by
     selection.js only where they have something to say; the ELEMENT is always in the document so
     that the count above is a count of the panel's design rather than of whatever happened to be
     selected when somebody looked. -->
<aside id="panel" aria-live="polite">
  <button id="close" aria-label="Close">&times;</button>
  <div class="preg" data-region="head">
    <div class="ptype" id="ptype"></div>
    <!-- tabindex="-1" AND NOT A TAB STOP. Issue 132. A row in this panel replaces the panel when
         it is pressed, so the element the keyboard was on is removed from the document and focus
         falls to the body, which is the reader losing their place at the exact moment they moved
         it. Pressing a row puts focus here instead, on the name of the object they just walked
         to, which is what a screen reader would read out anyway. -1 rather than 0 because it is
         not a control and must not be reached by tabbing. -->
    <h2 id="pname" tabindex="-1"></h2>
    <p class="pnote" id="pnote"></p>
  </div>
  <!-- One row per edge, in the model's own order, each row a press onto the object at the other
       end. The words are the words the panel already printed as one sentence. -->
  <section class="preg" data-region="relationships" id="prel" hidden>
    <h3 class="preg-t">relationships</h3>
    <ul class="preg-rows" id="prelrows"></ul>
  </section>
  <!-- The membership of the band this object is drawn in, under the scope and the window in
       force, in the order the drawing paints them. The heading names the lane as the build names
       it, which is the same vocabulary the lane counts are published under. -->
  <section class="preg" data-region="in this lane" id="plane" hidden>
    <h3 class="preg-t" id="planet"></h3>
    <ul class="preg-rows" id="planerows"></ul>
  </section>
  <!-- A session template's own agenda beats. The outline sheet is not redrawn here and this is
       not a second copy of it: the sheet stays the sheet and this is the object's own rows. -->
  <section class="preg" data-region="its outline" id="pout" hidden>
    <h3 class="preg-t">its outline</h3>
    <ul class="agenda-lines" id="poutrows"></ul>
  </section>
  <!-- NEVER AN ABSENCE RENDERED AS A FACT. On a cohort session nobody is teaching, this names the
       instructors the drawing in front of the reader actually holds, each a press onto their
       tile. On a drawing that holds none it says so and says how much of the programme it draws.
       It never says nobody teaches the programme, because nothing in the model records who can
       teach anything. -->
  <section class="preg" data-region="the instructors this drawing holds" id="pholds" hidden>
    <h3 class="preg-t">the instructors this drawing holds</h3>
    <ul class="preg-rows" id="pholdsrows"></ul>
    <p class="preg-none" id="pholdsnone"></p>
  </section>
  <div class="preg" data-region="what it holds">
    <dl id="pprops"></dl>
  </div>
  <!-- Written by app.js for the one node that stands for a list, and empty for every other. -->
  <div class="pmore" id="pmore"></div>
</aside>

<!-- The cohort in full. The rows are not written here: they are in the drawing's own generated
     file, because they are the model and not page furniture, and app.js builds this the first
     time the view is opened. Hidden until then, which also keeps it out of the tab order.

     `role="dialog"` AND NO `aria-modal`, WHICH IS ISSUE 86 AND IS NOT A WEAKENING. aria-modal
     says content outside this element is inert, and a screen reader acts on that by refusing to
     leave the dialog. Since #86 the header is deliberately outside it and deliberately live, so
     the attribute would be a claim the page does not implement, and the one control it would put
     out of reach is the one that card exists to make reachable: a reader who cannot get to
     `feedback` cannot report anything at all. The sheet is still modal in every sense the page
     enforces. It covers the drawing, the backdrop makes the canvas inert, Escape closes it and
     the close control is focused when it opens. What it never was is modal to the page. -->
<div id="roster" class="sheet" hidden>
  <div class="sheet-back" id="rosterback"></div>
  <section class="sheet-box" role="dialog" aria-labelledby="rostertitle">
    <div class="sheet-head">
      <div>
        <h2 id="rostertitle"></h2>
        <p class="sheet-sub" id="rostersub"></p>
      </div>
      <button id="rosterclose" class="linkbtn" type="button" aria-label="Close the student list"
              title="close (Esc)">&times;</button>
    </div>
    <div class="sheet-rows" id="rosterrows"></div>
  </section>
</div>

<!-- THE SAME TERM, READ TWICE. Issues 80 and 82, and they are one card because they are the two
     halves of one split: #/calendar is the instances in date order, #/outline is the templates in
     curriculum order, and a reader who meets the same term under both orderings has been shown the
     template versus instance distinction rather than told it.

     ONE SHEET AND TWO ADDRESSES. One sheet because both readings want the same box, the same
     close and the same provenance notice, and because switching between them is the point. Two
     addresses because #/board and #/students established that a view worth having is worth an
     address, and because the heading can only say what is on screen if there is a route for it to
     say it about.

     ITS SCOPE IS ALL SEVEN PROGRAMMES AND THAT IS THE DECISION. A calendar of one programme is
     what Notion already holds, one per programme per quarter, by the model's own account; the term
     across all seven exists nowhere, which is what makes it worth building and is the finding the
     notice states. The rows are not written here: term.js reads them out of the seven drawings.

     The classes are the student list's, because this is the same object: a sheet over the canvas
     with a scrolling table in it. They were named .roster-* while there was one of them. -->
<div id="term" class="sheet term" hidden>
  <div class="sheet-back" id="termback"></div>
  <!-- No aria-modal, for the reason written above the student list: since issue 86 the header
       is outside this dialog and live, so declaring the rest of the page inert would hide the
       feedback control from exactly the reader who has no other way to reach it. -->
  <section class="sheet-box" role="dialog" aria-labelledby="termtitle">
    <div class="sheet-head">
      <div>
        <h2 id="termtitle"></h2>
        <p class="sheet-sub" id="termsub"></p>
      </div>
      <button id="termclose" class="linkbtn" type="button" aria-label="Close"
              title="close (Esc)">&times;</button>
    </div>
    <!-- The two readings, as ordinary links to their own addresses. Anchors and not a widget, for
         issue 66's reason: the keyboard, the middle button, the context menu and the back button
         all work without this page implementing any of them, and there is one code path into a
         reading rather than two. -->
    <div class="term-switch" role="group" aria-label="reading">
      <a id="termcal" class="linkbtn" href="#/calendar">calendar</a>
      <a id="termout" class="linkbtn" href="#/outline">outline</a>
    </div>
    <!-- What this reading is and what it covers, above the rows and outside the scroll, so it is
         on screen for as long as the rows are. Written by term.js. -->
    <div class="term-notice" id="termnotice"></div>
    <div class="sheet-rows" id="termrows"></div>
  </section>
</div>

<!-- THE WATCHER FIRST, AND FIRST IS THE WHOLE OF WHAT IT IS FOR. Issue 166. app.js turns a broken
     load into a named throw and feedback.js registers the listener that reports one, and until
     this line feedback.js was loaded LAST, which is after every throw it was written to catch. A
     one node drift between the two generated documents below therefore drew a blank canvas and
     said nothing, and that drift is the most likely failure a private deployment of this page
     has. boot.js is ahead of the deploy stamp and of the data because a file that reports what
     did not load has to be watching before anything can fail to load, and it is a file rather
     than four lines in the head because the policy at the top of this document refuses an inline
     script. It draws nothing on a page that came up. -->
<script src="boot.js"></script>
<!-- The deploy stamp next, because three of the scripts under it can be asked what commit this
     page is, and feedback.js and boot.js are asked exactly when app.js has thrown. It is a static
     file in the repository naming no commit, and the deploy workflow rewrites it with the sha it
     publishes. -->
<script src="version.js"></script>
<!-- Two documents and not one, issue 60 seam 1. instance.js is what the objects are and
     layout.js is where they go; app.js joins them. The published page is public, so real data can
     never go on it, and the only way this codebase ever serves both the public toy and a private
     management tool is if the data document loads separately from the page. Anything that reads
     the model reads instance.js; nothing but the drawing reads layout.js. -->
<script src="instance.js"></script>
<script src="layout.js"></script>
<!-- The page, in four concerns and the file that wires them, issue 71 seam 2 of issue 60.
     render.js paints the drawing from geometry and holds no state a reader can change; viewport.js
     owns pan, zoom and fit, which is three numbers; selection.js owns what is picked, what that
     dims and what it reveals; router.js owns the addresses and the two views an address switches
     between. app.js joins the two generated documents, builds those four, wires them and publishes
     window.ZT.

     THE ORDER OF THESE FOUR DOES NOT MATTER AND app.js LAST DOES. There is no bundler and no build
     step here, and the page has to work opened from a file:// URL, so ES modules are out and these
     are ordinary scripts. Each of the four defines exactly one factory on window.ZM and executes
     nothing at all, which is what makes their order among themselves irrelevant; app.js is the only
     one that runs anything, and it checks all four factories are there and throws by name if one is
     missing rather than half drawing the page. Adding a fifth means adding a tag here and naming it
     in that check, and nothing else. -->
<script src="render.js"></script>
<script src="viewport.js"></script>
<script src="selection.js"></script>
<script src="router.js"></script>
<!-- The fifth, and it arrived exactly as the note above says a fifth would: a tag here and a name
     in app.js's check. term.js owns #/calendar and #/outline and the sheet they open. It is not in
     router.js because it is the one view on this page with no opinion about which of the seven
     programmes is drawn: it reads across all of them. Issues 80 and 82. -->
<script src="term.js"></script>
<script src="app.js"></script>
<script src="board.js"></script>
<!-- feedback.js STAYS LAST and issue 166 left it there on purpose. The two files divide the page's
     life between them: boot.js at the top of this list watches the load and answers in three
     states whether it finished, and feedback.js from down here owns everything a reader does
     afterwards, which is the half that needs the filing machinery, the token and the popover. The
     order board.js relies on, that it is loaded before the file publishing window.ZMT and so reads
     it at call time, is unchanged. -->
<script src="feedback.js"></script>
</body>
</html>
